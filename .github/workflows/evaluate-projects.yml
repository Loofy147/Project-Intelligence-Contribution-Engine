name: evaluate-real-projects

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/evaluate-projects.yml"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate ${{ matrix.project_id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project_id: contribution-network
            repository: Loofy147/contribution-network
            project_name: Contribution Network Bounties
            repository_url: https://github.com/Loofy147/contribution-network
          - project_id: context-swarm
            repository: Loofy147/Context-swarm
            project_name: Context Swarm
            repository_url: https://github.com/Loofy147/Context-swarm
          - project_id: contribquest-app
            repository: Loofy147/Contribution-bounties-centre-
            project_name: ContribQuest WorkLink
            repository_url: https://github.com/Loofy147/Contribution-bounties-centre-

    steps:
      - name: Check out the engine
        uses: actions/checkout@v4

      - name: Check out target project (read-only analysis)
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: main
          path: targets/${{ matrix.project_id }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine
        run: python -m pip install -e ".[dev]"

      - name: Create stable external project manifest
        env:
          PROJECT_ID: ${{ matrix.project_id }}
          PROJECT_NAME: ${{ matrix.project_name }}
          REPOSITORY_URL: ${{ matrix.repository_url }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/evaluation-manifests"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "schema_version": 1,
              "id": os.environ["PROJECT_ID"],
              "name": os.environ["PROJECT_NAME"],
              "description": "Read-only repository evaluation generated by Project Intelligence & Contribution Engine.",
              "repository_url": os.environ["REPOSITORY_URL"],
              "tags": ["evaluation", "read-only"],
          }
          target = Path(os.environ["GITHUB_WORKSPACE"]) / "evaluation-manifests" / f"{manifest['id']}.json"
          target.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(f"Created external manifest: {target.name}")
          PY

      - name: Build inventory and draft tasks
        env:
          PROJECT_ID: ${{ matrix.project_id }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          TARGET="targets/$PROJECT_ID"
          OUT="artifacts/$PROJECT_ID"
          MANIFEST="$GITHUB_WORKSPACE/evaluation-manifests/$PROJECT_ID.json"
          mkdir -p "$OUT"

          pie inventory "$TARGET" --manifest "$MANIFEST" --format json --output "$OUT/inventory.json"
          pie inventory "$TARGET" --manifest "$MANIFEST" --format markdown --output "$OUT/inventory.md"
          pie tasks "$TARGET" --manifest "$MANIFEST" \
            --json-output "$OUT/tasks.json" \
            --markdown-output "$OUT/tasks.md"
          pie verify-tasks "$TARGET" --manifest "$MANIFEST" \
            --task-file "$OUT/tasks.json" > "$OUT/verification.txt"

      - name: Summarize evaluation
        env:
          PROJECT_ID: ${{ matrix.project_id }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          project_id = os.environ["PROJECT_ID"]
          root = Path(os.environ["GITHUB_WORKSPACE"]) / "artifacts" / project_id
          inventory = json.loads((root / "inventory.json").read_text(encoding="utf-8"))
          task_set = json.loads((root / "tasks.json").read_text(encoding="utf-8"))
          verification_text = (root / "verification.txt").read_text(encoding="utf-8")
          task_summary = task_set["summary"]
          languages = ", ".join(
              f"{item['name']} ({item['file_count']})"
              for item in inventory["languages"][:8]
          ) or "none detected"
          kinds = Counter(task["kind"] for task in task_set["tasks"])
          observed = [task for task in task_set["tasks"] if task["classification"] == "observed"]
          hypotheses = [task for task in task_set["tasks"] if task["classification"] == "hypothesis"]

          lines = [
              f"# Evaluation: {inventory['project']['name']}",
              "",
              f"- Repository: {inventory['project']['repository_url']}",
              f"- Files indexed: {inventory['summary']['files_indexed']}",
              f"- Files skipped: {inventory['summary']['files_skipped']}",
              f"- Languages: {languages}",
              f"- Recognized technology markers: {len(inventory['technology_signals'])}",
              f"- Review hypotheses from inventory: {len(inventory['review_signals'])}",
              f"- Draft tasks: {task_summary['total_drafts']} "
              f"({task_summary['observed_marker_tasks']} observed markers; "
              f"{task_summary['hypothesis_review_tasks']} hypotheses)",
              f"- Task kinds: {', '.join(f'{key}={value}' for key, value in sorted(kinds.items())) or 'none'}",
              "",
              "## Inventory hypotheses",
              "",
          ]
          for signal in inventory["review_signals"]:
              lines.append(f"- **{signal['title']}**: {signal['observed_fact']} Hypothesis: {signal['hypothesis']}")
          if not inventory["review_signals"]:
              lines.append("- None generated.")
          lines.extend(["", "## Sample source-marker drafts", ""])
          for task in observed[:15]:
              evidence = task["evidence"]
              lines.append(f"- {evidence.get('path')}:{evidence.get('line_number')} — {task['title']}")
          if not observed:
              lines.append("- No source-marker drafts generated.")
          lines.extend(["", "## Verification", "", "~~~text", verification_text.rstrip(), "~~~", ""])
          summary = "\n".join(lines)
          (root / "summary.md").write_text(summary, encoding="utf-8")
          (root / "summary.json").write_text(json.dumps({
              "project_id": project_id,
              "repository_url": inventory["project"]["repository_url"],
              "inventory_summary": inventory["summary"],
              "languages": inventory["languages"],
              "technology_signal_count": len(inventory["technology_signals"]),
              "review_signals": inventory["review_signals"],
              "task_summary": task_summary,
              "task_kinds": dict(kinds),
              "sample_observed_tasks": observed[:15],
              "sample_hypothesis_tasks": hypotheses[:10],
          }, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary)
          print(summary)

          if task_set.get("policy", {}).get("automatic_bounty_creation") is not False:
              raise SystemExit("Unexpected policy: task drafts must not create bounties.")
          PY

      - name: Upload evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: project-evaluation-${{ matrix.project_id }}
          path: artifacts/${{ matrix.project_id }}/
          if-no-files-found: error
          retention-days: 14
