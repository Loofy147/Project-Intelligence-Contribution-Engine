name: evaluate-real-projects

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/evaluate-projects.yml"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate ${{ matrix.project_id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project_id: contribution-network
            repository: Loofy147/contribution-network
            project_name: Contribution Network Bounties
            repository_url: https://github.com/Loofy147/contribution-network
          - project_id: context-swarm
            repository: Loofy147/Context-swarm
            project_name: Context Swarm
            repository_url: https://github.com/Loofy147/Context-swarm
          - project_id: contribquest-app
            repository: Loofy147/Contribution-bounties-centre-
            project_name: ContribQuest WorkLink
            repository_url: https://github.com/Loofy147/Contribution-bounties-centre-

    steps:
      - name: Check out the engine
        uses: actions/checkout@v4

      - name: Check out target project (read-only analysis)
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: main
          path: targets/${{ matrix.project_id }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine
        run: python -m pip install -e ".[dev]"

      - name: Create stable external project manifest
        env:
          PROJECT_ID: ${{ matrix.project_id }}
          PROJECT_NAME: ${{ matrix.project_name }}
          REPOSITORY_URL: ${{ matrix.repository_url }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/evaluation-manifests"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "schema_version": 1,
              "id": os.environ["PROJECT_ID"],
              "name": os.environ["PROJECT_NAME"],
              "description": "Read-only repository evaluation generated by Project Intelligence & Contribution Engine.",
              "repository_url": os.environ["REPOSITORY_URL"],
              "tags": ["evaluation", "read-only"],
          }
          # Context Swarm already has a canonical typed registry. Import only its
          # declared active work-item states, not future-runtime acceptance gates.
          if manifest["id"] == "context-swarm":
              manifest["registry_work_item_sources"] = [{
                  "path": "swarm/registry.json",
                  "collection": "work_items",
                  "id_field": "work_item_id",
                  "title_field": "title",
                  "status_field": "status",
                  "active_statuses": [
                      "ready", "triaged", "in_progress", "blocked",
                      "conflicted", "needs_information", "review",
                  ],
              }]
          target = Path(os.environ["GITHUB_WORKSPACE"]) / "evaluation-manifests" / f"{manifest['id']}.json"
          target.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(f"Created external manifest: {target.name}")
          PY

      - name: Build inventory and draft tasks
        env:
          PROJECT_ID: ${{ matrix.project_id }}
          REPOSITORY: ${{ matrix.repository }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          TARGET="targets/$PROJECT_ID"
          OUT="artifacts/$PROJECT_ID"
          MANIFEST="$GITHUB_WORKSPACE/evaluation-manifests/$PROJECT_ID.json"
          mkdir -p "$OUT"

          pie inventory "$TARGET" --manifest "$MANIFEST" --format json --output "$OUT/inventory.json"
          pie inventory "$TARGET" --manifest "$MANIFEST" --format markdown --output "$OUT/inventory.md"
          pie tasks "$TARGET" --manifest "$MANIFEST" \
            --json-output "$OUT/tasks.json" \
            --markdown-output "$OUT/tasks.md"
          pie github-issues "$REPOSITORY" --state open \
            --json-output "$OUT/issues.json" \
            --markdown-output "$OUT/issues.md"
          pie github-pulls "$REPOSITORY" --state open \
            --json-output "$OUT/pulls.json" \
            --markdown-output "$OUT/pulls.md"
          pie workplan --issues "$OUT/issues.json" --pulls "$OUT/pulls.json" --tasks "$OUT/tasks.json" \
            --json-output "$OUT/workplan.json" \
            --markdown-output "$OUT/workplan.md"
          pie verify-tasks "$TARGET" --manifest "$MANIFEST" \
            --task-file "$OUT/tasks.json" > "$OUT/verification.txt"

      - name: Summarize evaluation
        env:
          PROJECT_ID: ${{ matrix.project_id }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          project_id = os.environ["PROJECT_ID"]
          root = Path(os.environ["GITHUB_WORKSPACE"]) / "artifacts" / project_id
          inventory = json.loads((root / "inventory.json").read_text(encoding="utf-8"))
          task_set = json.loads((root / "tasks.json").read_text(encoding="utf-8"))
          issue_snapshot = json.loads((root / "issues.json").read_text(encoding="utf-8"))
          pull_snapshot = json.loads((root / "pulls.json").read_text(encoding="utf-8"))
          workplan = json.loads((root / "workplan.json").read_text(encoding="utf-8"))
          verification_text = (root / "verification.txt").read_text(encoding="utf-8")
          task_summary = task_set["summary"]
          languages = ", ".join(
              f"{item['name']} ({item['file_count']})"
              for item in inventory["languages"][:8]
          ) or "none detected"
          kinds = Counter(task["kind"] for task in task_set["tasks"])
          markers = [task for task in task_set["tasks"] if task["kind"] == "marker_follow_up"]
          checklists = [task for task in task_set["tasks"] if task["kind"] == "checklist_follow_up"]
          registry_items = [task for task in task_set["tasks"] if task["kind"] == "registry_work_item"]
          observed = markers + checklists
          hypotheses = [task for task in task_set["tasks"] if task["classification"] == "hypothesis"]

          lines = [
              f"# Evaluation: {inventory['project']['name']}",
              "",
              f"- Repository: {inventory['project']['repository_url']}",
              f"- Files indexed: {inventory['summary']['files_indexed']}",
              f"- Files skipped: {inventory['summary']['files_skipped']}",
              f"- Languages: {languages}",
              f"- Recognized technology markers: {len(inventory['technology_signals'])}",
              f"- Review hypotheses from inventory: {len(inventory['review_signals'])}",
              f"- Generated task records: {task_summary['total_drafts']} "
              f"({task_summary['observed_marker_tasks']} source markers; "
              f"{task_summary.get('observed_checklist_tasks', 0)} configured checklist items; "
              f"{task_summary.get('registry_work_item_tasks', 0)} canonical registry projections; "
              f"{task_summary['hypothesis_review_tasks']} hypotheses)",
              f"- Existing GitHub issues: {issue_snapshot['summary']['issues_found']} "
              f"({issue_snapshot['summary']['open']} open in this snapshot)",
              f"- Existing pull requests: {pull_snapshot['summary']['pull_requests_found']} "
              f"({pull_snapshot['summary']['open']} open; {pull_snapshot['summary']['drafts']} drafts)",
              f"- Work-plan issue priority counts: {workplan['summary']['issues_by_priority']}",
              f"- Task kinds: {', '.join(f'{key}={value}' for key, value in sorted(kinds.items())) or 'none'}",
              "",
              "## Inventory hypotheses",
              "",
          ]
          for signal in inventory["review_signals"]:
              lines.append(f"- **{signal['title']}**: {signal['observed_fact']} Hypothesis: {signal['hypothesis']}")
          if not inventory["review_signals"]:
              lines.append("- None generated.")
          lines.extend(["", "## Source markers and configured checklist items", ""])
          for task in observed[:15]:
              evidence = task["evidence"]
              lines.append(f"- {evidence.get('path')}:{evidence.get('line_number')} — {task['title']}")
          if not observed:
              lines.append("- No marker/checklist tasks generated.")
          lines.extend(["", "## Canonical registry work-item projections", ""])
          for task in registry_items[:25]:
              evidence = task["evidence"]
              lines.append(f"- {task.get('source_work_item_id')} — {task['title']} (source status: {task.get('source_status')}; {evidence.get('path')}#{evidence.get('json_pointer')})")
          if not registry_items:
              lines.append("- No configured active registry work items.")
          lines.extend(["", "## Existing GitHub issues (canonical work records)", ""])
          for issue in issue_snapshot["issues"][:10]:
              labels = ", ".join(issue["labels"]) or "unlabeled"
              lines.append(f"- [#{issue['number']} — {issue['title']}]({issue['url']}) ({issue['state']}; {labels})")
          if not issue_snapshot["issues"]:
              lines.append("- No issues found in the selected state.")
          lines.extend(["", "## Open pull requests (proposals)", ""])
          for pr in pull_snapshot["pull_requests"][:10]:
              status = "draft" if pr["draft"] else "not draft"
              lines.append(f"- [#{pr['number']} — {pr['title']}]({pr['url']}) ({status}; {pr['head_ref']} → {pr['base_ref']})")
          if not pull_snapshot["pull_requests"]:
              lines.append("- No open pull requests found.")
          lines.extend(["", "## Priority work plan", "", "~~~markdown", (root / "workplan.md").read_text(encoding="utf-8").rstrip(), "~~~", "", "## Verification", "", "~~~text", verification_text.rstrip(), "~~~", ""])
          summary = "\n".join(lines)
          (root / "summary.md").write_text(summary, encoding="utf-8")
          (root / "summary.json").write_text(json.dumps({
              "project_id": project_id,
              "repository_url": inventory["project"]["repository_url"],
              "inventory_summary": inventory["summary"],
              "languages": inventory["languages"],
              "technology_signal_count": len(inventory["technology_signals"]),
              "review_signals": inventory["review_signals"],
              "task_summary": task_summary,
              "task_kinds": dict(kinds),
              "github_issue_summary": issue_snapshot["summary"],
              "github_issues": issue_snapshot["issues"][:25],
              "github_pull_request_summary": pull_snapshot["summary"],
              "github_pull_requests": pull_snapshot["pull_requests"][:25],
              "workplan_summary": workplan["summary"],
              "sample_observed_tasks": observed[:15],
              "canonical_registry_work_items": [{
                  "source_work_item_id": task.get("source_work_item_id"),
                  "title": task["title"],
                  "source_status": task.get("source_status"),
                  "evidence": task.get("evidence"),
              } for task in registry_items[:25]],
              "sample_hypothesis_tasks": hypotheses[:10],
          }, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary)
          print(summary)

          if task_set.get("policy", {}).get("automatic_bounty_creation") is not False:
              raise SystemExit("Unexpected policy: task drafts must not create bounties.")
          PY

      - name: Upload evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: project-evaluation-${{ matrix.project_id }}
          path: artifacts/${{ matrix.project_id }}/
          if-no-files-found: error
          retention-days: 14
