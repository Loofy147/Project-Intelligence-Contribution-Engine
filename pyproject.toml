[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-intelligence-contribution-engine"
version = "0.1.0"
description = "A local-first CLI for indexing project files and finding evidence-backed contribution opportunities."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Loofy147" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pie = "project_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
